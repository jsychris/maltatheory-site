<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malta Theory</title>
<style>
  :root{--bg:#f6f7f9;--card:#ffffff;--fg:#1a1c22;--muted:#5b6370;--accent:#1565c0}
  @media (prefers-color-scheme:dark){
    :root{--bg:#101217;--card:#1a1e26;--fg:#f0f2f5;--muted:#9aa1ad;--accent:#64a9f0}
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:48px 16px;display:flex;justify-content:center}
  main{max-width:560px;background:var(--card);border-radius:16px;
    padding:36px 30px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
  .roundel{width:84px;height:84px;border-radius:50%;background:#fff;
    border:10px solid #e41e2c;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:30px;color:#111;margin:0 auto 18px}
  h1{font-size:1.8em;margin:.1em 0}
  p{color:var(--muted)}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .links a{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;
    padding:10px 20px;border-radius:99px}
  .links a.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
</style>
</head>
<body>
<main>
  <div class="roundel">50</div>
  <h1>Malta Theory</h1>
  <p>Pass Malta's driving theory test — car &amp; motorcycle, a tile board of topics, a 60-second Speed Round,
  a Sign Sorter and mock papers in the real 35-question format.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a class="ghost" href="privacy.html">Privacy Policy</a>
  </div>
</main>
</body>
</html>
